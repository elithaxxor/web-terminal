<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shodan Search | Interactive Shell</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="bg-[#1a1d21] text-white min-h-screen flex flex-col">
  <header class="py-4 px-6 bg-[#2a2e35]/80 backdrop-blur-sm fixed w-full z-50">
    <nav class="container mx-auto flex justify-between items-center">
      <a href="/" class="flex items-center space-x-2">
        <span class="text-green-400 text-2xl">></span>
        <span class="text-xl font-semibold">Interactive Shell</span>
      </a>
      <div class="hidden md:flex space-x-6">
        <a href="/terminal.html" class="hover:text-green-400 transition-colors">Terminal</a>
        <a href="https://desktop.interactiveshell.com" class="hover:text-green-400 transition-colors">Desktop</a>
        <a href="/drive" class="hover:text-green-400 transition-colors">IDE Drive</a>
        <a href="/pricing" class="hover:text-green-400 transition-colors">Pricing</a>
        <a href="/training" class="hover:text-green-400 transition-colors">Training</a>
        <a href="/blog" class="hover:text-green-400 transition-colors">Blog</a>
        <a href="/about" class="hover:text-green-400 transition-colors">About</a>
        <a href="/contact" class="hover:text-green-400 transition-colors">Contact</a>
        <a href="/shodan.html" class="text-green-400 font-semibold">Shodan</a>
      </div>
      <button class="md:hidden text-white">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </nav>
  </header>

  <main class="flex-grow pt-20 px-6">
    <div class="container mx-auto max-w-4xl">
      <h1 class="text-3xl font-bold mb-6">Shodan Search</h1>
      <form id="shodan-form" class="mb-6 flex space-x-4">
        <input
          type="text"
          id="query"
          placeholder="Enter search query"
          class="flex-grow px-4 py-2 rounded bg-[#2a2e35] border border-gray-600 focus:outline-none focus:border-green-400"
          required
        />
        <button
          type="submit"
          class="px-6 py-2 bg-green-500 rounded hover:bg-green-600 transition-colors"
        >
          Search
        </button>
      </form>
      <div id="results" class="space-y-4"></div>
    </div>
  </main>

  <footer class="bg-[#2a2e35] py-8 px-6 mt-20">
    <div class="container mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-center mb-8">
        <div class="flex items-center space-x-2 mb-4 md:mb-0">
          <span class="text-green-400 text-2xl">></span>
          <span class="text-xl font-semibold">Interactive Shell</span>
        </div>
        <div class="flex space-x-6 social-icons">
          <a href="https://www.facebook.com/interactivesh" class="text-2xl hover:text-green-400 transition-colors">
            <i class="fab fa-facebook"></i>
          </a>
          <a href="https://x.com/interactivesh" class="text-2xl hover:text-green-400 transition-colors">
            <i class="fab fa-twitter"></i>
          </a>
          <a href="https://www.youtube.com/@InteractiveShell" class="text-2xl hover:text-green-400 transition-colors">
            <i class="fab fa-youtube"></i>
          </a>
        </div>
      </div>
      <div class="text-center text-gray-400">
        <p>© Interactive Shell 2025.</p>
      </div>
    </div>
  </footer>

  <script>
    const form = document.getElementById('shodan-form');
    const resultsDiv = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultsDiv.innerHTML = '<p>Loading...</p>';
      const query = document.getElementById('query').value;

      try {
        const response = await fetch('/api/shodan-search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            // Add authorization header with token if needed
          },
          body: JSON.stringify({ query }),
        });

        if (!response.ok) {
          const error = await response.json();
          resultsDiv.innerHTML = `<p class="text-red-500">Error: ${error.error}</p>`;
          return;
        }

        const data = await response.json();
        if (!data.matches || data.matches.length === 0) {
          resultsDiv.innerHTML = '<p>No results found.</p>';
          return;
        }

        resultsDiv.innerHTML = '';
        data.matches.forEach((match) => {
          const div = document.createElement('div');
          div.className = 'p-4 bg-[#2a2e35] rounded shadow';
          div.innerHTML = `
            <p><strong>IP:</strong> ${match.ip_str}</p>
            <p><strong>Port:</strong> ${match.port}</p>
            <p><strong>Data:</strong> <pre class="whitespace-pre-wrap">${match.data}</pre></p>
          `;
          resultsDiv.appendChild(div);
        });
      } catch (error) {
        resultsDiv.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
